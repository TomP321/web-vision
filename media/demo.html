<!doctype html><html><head><meta charset=utf-8><title>Todo demo</title>
<style>body{font:16px system-ui,sans-serif;margin:40px;background:#f6f7f9;color:#222}.card{background:#fff;border-radius:10px;padding:24px 28px;max-width:560px;box-shadow:0 2px 10px #0001}
h1{margin:0 0 16px;font-size:24px}input{font:inherit;padding:8px 10px;border:1px solid #bbb;border-radius:6px;width:320px}button{font:inherit;padding:8px 14px;border:0;border-radius:6px;background:#2563eb;color:#fff;margin-left:6px;cursor:pointer}
#bad{background:#dc2626}ul{padding-left:20px}li{margin:6px 0}.done{color:#888;text-decoration:line-through}#toast{position:fixed;right:30px;bottom:30px;background:#16a34a;color:#fff;padding:10px 16px;border-radius:8px;display:none}</style></head>
<body><div class=card><h1>Todo demo</h1><input id=t placeholder="What needs to be done?"><button id=add>Add</button><button id=bad>Broken button</button>
<ul id=l><li>Write the README</li></ul></div><div id=toast>Saved</div>
<script>add.onclick=()=>{if(!t.value)return;const li=document.createElement('li');li.textContent=t.value;l.appendChild(li);t.value='';toast.style.display='block';setTimeout(()=>toast.style.display='none',3000)};
bad.onclick=()=>{const user=null;console.log('saving',user.name)}</script></body></html>
